plugins {
    id 'fabric-loom' version '1.14.4'
}

version = '2.9.1'
group = 'com.xiaona'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

// 不再需要 shade：QQ/AI 已经搬回本机，mod 只依赖 MC + Fabric API。
// sqlite-jdbc 只用于**只读**打开 Paradigm 的封禁库；include 会把它嵌进 mod jar，
// 服务器端不需要额外装驱动（jar 体积会增加约 13MB）。
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    include 'org.xerial:sqlite-jdbc:3.46.1.3'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// 注：`gradlew build` 会同时构建根项目（1.21.11）与各子项目（1.21.1 / 1.21.8）；
// 只构建某一个版本时用 `gradlew :fabric-1.21.1:build`。