<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0f2f5">
<title>小钠控制面板 · 兼容模式</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f0f2f5;color:#1f2329;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{max-width:560px;margin:0 auto 14px;background:#fff;border:1px solid #e8ebf0;border-radius:10px;padding:16px}
h1{font-size:17px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:#8a919f;font-size:12.5px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px solid #eef1f5;font-size:14px}
td:last-child{text-align:right;font-weight:600}
tr:last-child td{border-bottom:0}
input,textarea{width:100%;min-height:42px;padding:9px 12px;margin:6px 0;border:1px solid #d9d9d9;border-radius:8px;
  background:#fff;color:#1f2329;font:inherit;font-size:15px}
textarea{resize:vertical;min-height:64px}
button{min-height:42px;padding:0 18px;border:0;border-radius:8px;background:#1677ff;color:#fff;
  font:inherit;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
button.ghost{background:#fff;color:#1f2329;border:1px solid #d9d9d9}
.msg{color:#ff4d4f;font-size:12.5px;min-height:18px}
.chat{height:50vh;min-height:240px;overflow-y:auto;background:#fafbfc;border:1px solid #e8ebf0;border-radius:8px;padding:12px}
.line{margin-bottom:9px;word-break:break-word}
.line.me{text-align:right}
.bub{display:inline-block;max-width:82%;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #e8ebf0;text-align:left}
.line.me .bub{background:#1677ff;border-color:#1677ff;color:#fff}
.err{color:#c0392b}
.foot{margin-top:10px}
.foot textarea{margin:0 0 8px}
.hint{color:#8a919f;font-size:12px;margin-top:8px}
a{color:#1677ff}
</style>
</head>
<body>

<div class="card">
  <h1>🤖 小钠控制面板 · 兼容模式</h1>
  <div class="sub">当前浏览器较旧，已自动切换为精简版；状态、登录、私聊试用可正常使用。
    <a href="/">试试完整面板</a></div>
  <div id="authBox" style="display:none">
    <h2>登录</h2>
    <input id="u" placeholder="账号" autocomplete="username">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password">
    <div id="capBox" style="display:none">
      <input id="c" placeholder="人机验证（4 位数字）" inputmode="numeric" maxlength="4">
      <img id="cap" alt="验证码" title="点一下换一张" onclick="freshCap()"
           style="height:42px;vertical-align:middle;cursor:pointer;border:1px solid #d9d9d9;border-radius:6px">
    </div>
    <button id="loginBtn" onclick="doLogin()">登录</button>
    <div class="msg" id="authMsg"></div>
  </div>
  <div id="statusBox" style="display:none">
    <table>
      <tr><td>控制面板</td><td id="stUp">—</td></tr>
      <tr><td>QQ 客户端</td><td id="stQq">—</td></tr>
      <tr><td>SnowLuma</td><td id="stSl">—</td></tr>
      <tr><td>机器人</td><td id="stBot">—</td></tr>
      <tr><td>WebUI 端口</td><td id="stPort">—</td></tr>
    </table>
    <div class="hint" id="whoLine"></div>
    <button class="ghost" id="logoutBtn" onclick="doLogout()" style="margin-top:10px">退出登录</button>
  </div>
</div>

<div class="card">
  <h2>🧪 私聊试用</h2>
  <div class="sub" id="trialWho">未登录：以普通用户「小锂」身份试用；登录后按所有者身份试用。</div>
  <div class="chat" id="msgs"></div>
  <div class="foot">
    <textarea id="t" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="sendBtn" onclick="sendTrial()">发送</button>
  </div>
  <div class="msg" id="chatMsg"></div>
</div>

<script>
function $(id){return document.getElementById(id);}
function xhrJson(method,url,body,cb){
  var x=new XMLHttpRequest();
  x.open(method,url,true);
  x.setRequestHeader('Content-Type','application/json');
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var j={}; try{j=JSON.parse(x.responseText||'{}');}catch(e){}
    cb(x.status,j);
  };
  x.onerror=function(){cb(0,{});};
  x.send(body?JSON.stringify(body):null);
}
function setText(id,v){var e=$(id);if(e)e.textContent=v;}

var loggedIn=false;
function loadStatus(){
  xhrJson('GET','/api/status',null,function(code,d){
    if(code===401){
      loggedIn=false;
      $('authBox').style.display='block';
      $('statusBox').style.display='none';
      $('trialWho').textContent='未登录：以普通用户「小锂」身份试用；登录后按所有者身份试用。';
      return;
    }
    if(code!==200||!d||d.error){
      $('authBox').style.display='block';
      $('statusBox').style.display='none';
      return;
    }
    loggedIn=true;
    $('authBox').style.display='none';
    $('statusBox').style.display='block';
    setText('stUp','正常');
    setText('stQq',d.qqRunning?'运行中':'未运行');
    setText('stSl',d.snowlumaUp?'在线':'离线');
    setText('stBot',d.botConnected?'已连接':'未连接');
    setText('stPort',d.webuiPort||'—');
    setText('whoLine','所有者：'+(d.owner||'未设置'));
    $('trialWho').textContent='已登录：以所有者身份试用（# 命令按所有者权限执行）。';
  });
}
function doLogin(){
  var u=$('u').value,p=$('p').value,c=$('c').value;
  if(!u||!p){$('authMsg').textContent='请填写账号和密码';return;}
  $('loginBtn').disabled=true;
  xhrJson('POST','/api/login',{user:u,pass:p,captcha:c},function(code,d){
    $('loginBtn').disabled=false;
    if(code>=200&&code<300&&d.ok){$('authMsg').textContent='';loadStatus();return;}
    $('authMsg').textContent=d.error||('登录失败（HTTP '+code+'）');
    if(d.captchaRequired){$('capBox').style.display='block';freshCap();}
  });
}
function freshCap(){$('cap').src='/api/captcha?t='+new Date().getTime();}
function doLogout(){
  xhrJson('POST','/api/logout',null,function(){location.reload();});
}

var busy=false;
function addLine(me,text){
  var box=$('msgs');
  var row=document.createElement('div');
  row.className='line'+(me?' me':'');
  var b=document.createElement('div');
  b.className='bub';
  b.textContent=text;
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop=box.scrollHeight;
  return b;
}
function sendTrial(){
  if(busy)return;
  var t=$('t').value.replace(/^\s+|\s+$/g,'');
  if(!t){return;}
  busy=true;$('sendBtn').disabled=true;$('t').value='';$('chatMsg').textContent='';
  addLine(true,t);
  var b=addLine(false,'小钠正在输入…');
  xhrJson('POST','/api/trial/chat',{text:t},function(code,d){
    busy=false;$('sendBtn').disabled=false;
    if(code>=200&&code<300&&d.ok&&d.reply){
      b.textContent=d.reply;
    }else{
      b.className='bub err';
      b.textContent='⚠️ '+(d.error||('HTTP '+code));
    }
    $('msgs').scrollTop=$('msgs').scrollHeight;
  });
}
$('t').onkeydown=function(e){
  e=e||window.event;
  var k=e.keyCode||e.which;
  if(k===13&&!e.shiftKey){if(e.preventDefault)e.preventDefault();sendTrial();return false;}
};
window.onpagehide=function(){
  try{if(navigator.sendBeacon)navigator.sendBeacon('/api/trial/reset');}catch(e){}
};
loadStatus();
</script>
</body>
</html>
