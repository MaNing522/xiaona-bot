<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0f2f5">
<title>小钠</title>
<style>
:root{--bg:#f0f2f5;--txt:#1f2329;--accent:#1677ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
/* 未登录主页：内容留空，只在右上角放登录入口 */
.top{position:fixed;top:16px;right:16px;display:flex;gap:10px}
.tb-auth{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 16px;
  border:1px solid var(--accent);border-radius:8px;background:#fff;color:var(--accent);
  font-size:14px;font-weight:500;text-decoration:none;transition:.15s}
.tb-auth:hover{background:#e6f4ff}
@media (max-width:520px){.top{top:12px;right:12px}}
</style>
</head>
<body>
<div class="top"><a class="tb-auth" href="/login">登录</a></div>
</body>
</html>
