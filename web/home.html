<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f2f5">
<title>小钠</title>
<style>
:root{--bg:#f0f2f5;--txt:#1f2329;--accent:#1677ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;min-height:100vh;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
/* 未登录主页：内容留空，只在右上角放登录入口 */
.top{position:fixed;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
  display:flex;gap:10px}
.tb-auth{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;
  border:1px solid var(--accent);border-radius:8px;background:#fff;color:var(--accent);
  font-size:14px;font-weight:500;text-decoration:none;transition:.15s;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tb-auth:hover{background:#e6f4ff}
.tb-auth:active{transform:scale(.97)}
@media (max-width:520px){.top{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}}
</style>
</head>
<body>
<div class="top"><a class="tb-auth" href="/login">登录</a></div>
</body>
</html>
