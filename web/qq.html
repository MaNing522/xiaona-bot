<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef1f5">
<title>小钠 · 网页版 QQ</title>
<style>
:root{
  --blue:#12b7f5; --blue-deep:#0099ff; --blue-soft:#e8f6ff;
  --bg:#eef1f5; --side:#f7f8fa; --chat:#f2f4f7; --card:#fff;
  --txt:#1f2329; --sub:#8a9099; --line:#e6e8eb; --danger:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#e9f0f8 0%,#f4f7fb 45%,#eef4f9 100%);
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
/* 应用窗口：仿 QQ NT 的圆角卡片 */
.app{
  width:min(1080px,96vw);height:min(760px,92vh);
  display:grid;grid-template-columns:264px 1fr;
  background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(23,43,77,.18),0 2px 8px rgba(23,43,77,.08);
}

/* ---------- 左侧会话栏 ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.me{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.avatar{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:600;user-select:none;background:linear-gradient(135deg,#7aa7ff,#4c7dff)}
.me-av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#b3c7d9,#8ea6bb);font-size:16px}
.me-info{min-width:0;flex:1}
.me-name{font-size:14px;font-weight:600}
.me-sub{font-size:11.5px;color:var(--sub);margin-top:2px}
.icon-btn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#eceff3;color:var(--txt)}
.search{margin:2px 14px 10px;display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;
  background:#eef1f5;border-radius:8px;color:var(--sub)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--txt);font-family:inherit}
.search input::placeholder{color:#aab0b8}
.conv-list{flex:1;overflow-y:auto;padding:4px 8px}
.conv{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;position:relative}
.conv.on{background:var(--blue-soft)}
.conv.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--blue-deep)}
.conv-main{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}
.conv-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.conv-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11px;color:#aab0b8;flex:0 0 auto}
.conv-prev{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.na-av{background:linear-gradient(135deg,#59d3ff,#0aa6ff);box-shadow:0 4px 10px rgba(18,183,245,.28)}
.side-foot{padding:10px 14px 14px;font-size:11.5px;color:#aab0b8;line-height:1.6;border-top:1px solid var(--line)}

/* ---------- 右侧聊天区 ---------- */
.chat{display:flex;flex-direction:column;min-width:0;background:var(--chat)}
.chat-head{height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:var(--card);border-bottom:1px solid var(--line)}
.chat-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.chat-name{font-size:16px;font-weight:600}
.chat-status{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.head-actions{display:flex;align-items:center;gap:6px}
.head-link{font-size:12.5px;color:var(--blue-deep);text-decoration:none;padding:7px 12px;border-radius:8px;border:1px solid #cdeaff;background:#f4fbff}
.head-link:hover{background:#e6f6ff}

.msgs{flex:1;overflow-y:auto;padding:18px 22px 8px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar,.conv-list::-webkit-scrollbar{width:6px}
.msgs::-webkit-scrollbar-thumb,.conv-list::-webkit-scrollbar-thumb{background:#d8dde3;border-radius:3px}
.time-sep{text-align:center;font-size:11.5px;color:#aab0b8;margin:6px 0 16px}
.row{display:flex;align-items:flex-end;gap:9px;margin-bottom:16px;animation:up .18s ease-out}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row.me{flex-direction:row-reverse}
.bub{max-width:min(66%,560px);padding:9px 13px;border-radius:12px;background:var(--card);
  font-size:14px;line-height:1.62;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px rgba(23,43,77,.06)}
.row.na .bub{border-top-left-radius:4px}
.row.me .bub{background:linear-gradient(135deg,#3ec3ff,#12a9f5);color:#fff;border-top-right-radius:4px;box-shadow:0 4px 12px rgba(18,183,245,.24)}
.row .avatar{width:34px;height:34px;border-radius:9px;font-size:13px}
.row.me .avatar{background:linear-gradient(135deg,#b3c7d9,#8ea6bb)}
.sys{text-align:center;margin:0 0 16px}
.sys span{display:inline-block;max-width:80%;padding:5px 12px;border-radius:8px;background:#e7eaef;
  color:#8a9099;font-size:12px;line-height:1.5}

/* 正在输入 */
.typing{display:none;padding:0 22px 6px;gap:9px;align-items:center;color:var(--sub);font-size:12px}
.typing.show{display:flex}
.typing .dots{display:inline-flex;gap:4px}
.typing i{width:5px;height:5px;border-radius:50%;background:#b6bec7;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-2px)}}

/* ---------- 输入区 ---------- */
.composer{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 18px 14px}
.tools{display:flex;align-items:center;gap:4px;margin-bottom:6px;color:#9aa1aa}
.tool{width:32px;height:30px;border:0;border-radius:7px;background:transparent;color:#9aa1aa;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.tool:hover{background:#f0f3f6;color:var(--txt)}
#input{width:100%;min-height:74px;max-height:160px;resize:none;border:0;outline:0;padding:2px 2px 6px;
  font-size:14px;line-height:1.6;color:var(--txt);font-family:inherit;background:transparent}
#input::placeholder{color:#aab0b8}
.send-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hint{font-size:11.5px;color:#aab0b8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#send{min-width:86px;height:34px;border:0;border-radius:8px;background:linear-gradient(135deg,#3ec3ff,#0a9cf0);
  color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(18,167,245,.28);transition:.15s}
#send:hover{filter:brightness(1.04)}
#send:disabled{opacity:.55;cursor:default;box-shadow:none}

/* 轻提示 */
.toast{position:fixed;left:50%;bottom:46px;transform:translate(-50%,10px);background:rgba(31,35,41,.86);
  color:#fff;font-size:12.5px;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.22s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 窄屏：收起左侧会话栏 */
@media (max-width:720px){
  .app{grid-template-columns:1fr;width:100vw;height:100vh;border-radius:0}
  .side{display:none}
  .chat-head{padding:0 16px}
  .msgs{padding:14px 14px 6px}
  .composer{padding:8px 12px 12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="me">
      <div class="avatar me-av">访</div>
      <div class="me-info">
        <div class="me-name">访客</div>
        <div class="me-sub">试用模式 · 无需登录</div>
      </div>
      <button class="icon-btn" title="登录面板" onclick="location.href='/login'">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
      </button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" placeholder="搜索" aria-label="搜索会话">
    </div>
    <div class="conv-list">
      <div class="conv on" id="convNa">
        <div class="avatar na-av">钠</div>
        <div class="conv-main">
          <div class="conv-top"><span class="conv-name">小钠</span><span class="conv-time" id="convTime">在线</span></div>
          <div class="conv-prev" id="convPrev">网页版试用，发消息就能聊</div>
        </div>
      </div>
    </div>
    <div class="side-foot">更多会话请到 QQ 里找我</div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <div class="chat-title">
        <div class="chat-name">小钠</div>
        <div class="chat-status"><i class="dot"></i>在线 · 网页试用</div>
      </div>
      <div class="head-actions">
        <a class="head-link" href="/login">登录面板</a>
      </div>
    </header>

    <div class="msgs" id="msgs">
      <div class="time-sep" id="timeSep">今天</div>
    </div>
    <div class="typing" id="typing">
      <span>小钠正在输入</span>
      <span class="dots"><i></i><i></i><i></i></span>
    </div>

    <footer class="composer">
      <div class="tools">
        <button class="tool" data-tip="网页试用暂不支持发送图片" title="图片">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
        </button>
        <button class="tool" data-tip="网页试用暂不支持发送文件" title="文件">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button class="tool" id="clearBtn" title="清屏">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
      <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
      <div class="send-row">
        <span class="hint">未登录访客有发送频率限制</span>
        <button id="send">发送</button>
      </div>
    </footer>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var msgs = document.getElementById('msgs');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var typing = document.getElementById('typing');
  var toastEl = document.getElementById('toast');
  var busy = false;
  var toastTimer = 0;

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function scrollBottom() {
    msgs.scrollTop = msgs.scrollHeight;
  }

  function timeText() {
    var d = new Date();
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function addRow(who, text) {
    var row = document.createElement('div');
    row.className = 'row ' + who;
    var av = document.createElement('div');
    av.className = 'avatar ' + (who === 'na' ? 'na-av' : '');
    av.textContent = who === 'na' ? '钠' : '访';
    var bub = document.createElement('div');
    bub.className = 'bub';
    bub.textContent = text;
    row.appendChild(av);
    row.appendChild(bub);
    msgs.appendChild(row);
    scrollBottom();
    document.getElementById('convTime').textContent = timeText();
    document.getElementById('convPrev').textContent = text.slice(0, 30);
    return bub;
  }

  function addSys(text) {
    var box = document.createElement('div');
    box.className = 'sys';
    var span = document.createElement('span');
    span.textContent = text;
    box.appendChild(span);
    msgs.appendChild(box);
    scrollBottom();
  }

  function setTyping(on) {
    typing.classList.toggle('show', !!on);
    if (on) scrollBottom();
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(160, input.scrollHeight) + 'px';
  }

  function finish() {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function send() {
    var text = input.value.replace(/^\s+|\s+$/g, '');
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    autoGrow();
    addRow('me', text);
    setTyping(true);

    fetch('/api/trial/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; });
      })
      .then(function (res) {
        setTyping(false);
        if (res.r.ok && res.j.ok && res.j.reply) {
          addRow('na', String(res.j.reply));
        } else {
          addSys('没发出去：' + (res.j.error || 'HTTP ' + res.r.status));
        }
      })
      .catch(function () {
        setTyping(false);
        addSys('网络错误，稍后再试');
      })
      .then(finish);
  }

  sendBtn.onclick = send;

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener('input', autoGrow);

  Array.prototype.forEach.call(document.querySelectorAll('.tool[data-tip]'), function (btn) {
    btn.addEventListener('click', function () { toast(btn.getAttribute('data-tip')); });
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    Array.prototype.slice.call(msgs.querySelectorAll('.row,.sys')).forEach(function (el) { el.remove(); });
    toast('已清空当前显示的聊天记录');
  });

  document.getElementById('search').addEventListener('input', function () {
    var q = this.value.trim();
    document.getElementById('convNa').style.display = (!q || '小钠'.indexOf(q) >= 0) ? '' : 'none';
  });

  (function boot() {
    document.getElementById('timeSep').textContent = '今天 ' + timeText();
    addRow('na', '你好呀，我是小钠。这个界面是照着 QQ 客户端做的，发消息会真的发给我。');
    addRow('na', '直接输入试试吧，Enter 发送。');
    document.getElementById('convTime').textContent = timeText();
    document.getElementById('convPrev').textContent = '在线 · 有什么想说的直接发我';
    input.focus();
    void d;
  })();
})();
</script>
</body>
</html>
